name: media-server
# Boot reconciliation and network recovery: scripts/media-server.service.

services:
  landing:
    image: ${LANDING_IMAGE:-nginxinc/nginx-unprivileged:1.30.6-alpine}
    container_name: media-landing
    restart: unless-stopped
    depends_on:
      updater:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    networks:
      - media
    ports:
      # Single LAN landing page with links to every service WebUI.
      - "${LAN_BIND_IP:-127.0.0.1}:${LANDING_PORT:-8090}:8080/tcp"
    volumes:
      # Static dashboard only; no persistent state.
      - ./landing:/usr/share/nginx/html:ro
      # Proxy update endpoints using Docker DNS; nginx refreshes recreated updater IPs.
      - ./landing/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  updater:
    build:
      context: ./updater
      args:
        UPDATER_BASE_IMAGE: ${UPDATER_BASE_IMAGE:-docker:29.9.3-cli}
    image: ${UPDATER_IMAGE:-media-server-updater:1}
    container_name: media-updater
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - media
    environment:
      UPDATE_TOKEN: ${UPDATE_TOKEN:-}
      PROJECT_DIR: ${MEDIA_SERVER_PROJECT_DIR:-${PWD}}
      SELF_SERVICE: updater
      DOCKER_CONFIG: /tmp/docker
    volumes:
      # Required so the updater can pull images and recreate this Compose stack.
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount at the same absolute path used on the host so Compose bind sources resolve correctly.
      - ./:${MEDIA_SERVER_PROJECT_DIR:-${PWD}}:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  jellyfin:
    image: ${JELLYFIN_IMAGE:-jellyfin/jellyfin:12.4}
    container_name: jellyfin
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - media
    ports:
      # Bind to the server LAN IP, not 0.0.0.0, so the service is LAN-scoped.
      - "${LAN_BIND_IP:-127.0.0.1}:${JELLYFIN_PORT:-8096}:8096/tcp"
    environment:
      TZ: ${TZ:-Etc/UTC}
      JELLYFIN_PublishedServerUrl: ${JELLYFIN_PUBLISHED_URL:-http://127.0.0.1:8096}
    volumes:
      # Persistent Jellyfin state.
      - ${CONFIG_ROOT:-./config}/jellyfin/config:/config
      - ${CONFIG_ROOT:-./config}/jellyfin/cache:/cache
      # Jellyfin only needs read access to finished media libraries.
      - ${MEDIA_ROOT:-/mnt/data/media}/movies:/media/movies:ro
      - ${MEDIA_ROOT:-/mnt/data/media}/tv:/media/tv:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8096/health >/dev/null || wget -q --spider http://127.0.0.1:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  qbittorrent:
    image: ${QBITTORRENT_IMAGE:-qbittorrentofficial/qbittorrent-nox:5.3.0-2}
    container_name: qbittorrent
    restart: unless-stopped
    stop_grace_period: 30m
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - media
    ports:
      # WebUI is intended for LAN access only.
      - "${LAN_BIND_IP:-127.0.0.1}:${QBT_WEBUI_PORT:-8080}:${QBT_WEBUI_PORT:-8080}/tcp"
      # Torrent peer traffic. Do not forward this from the router unless you intend to.
      - "${LAN_BIND_IP:-127.0.0.1}:${QBT_TORRENT_PORT:-6881}:${QBT_TORRENT_PORT:-6881}/tcp"
      - "${LAN_BIND_IP:-127.0.0.1}:${QBT_TORRENT_PORT:-6881}:${QBT_TORRENT_PORT:-6881}/udp"
    environment:
      TZ: ${TZ:-Etc/UTC}
      QBT_LEGAL_NOTICE: ${QBT_LEGAL_NOTICE:-}
      QBT_WEBUI_PORT: ${QBT_WEBUI_PORT:-8080}
      QBT_TORRENTING_PORT: ${QBT_TORRENT_PORT:-6881}
    volumes:
      # qBittorrent stores configuration in /config and downloaded data in /downloads.
      - ${CONFIG_ROOT:-./config}/qbittorrent:/config
      - ${MEDIA_ROOT:-/mnt/data/media}/downloads:/downloads
      - ${MEDIA_ROOT:-/mnt/data/media}/incomplete:/incomplete
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:${QBT_WEBUI_PORT:-8080}/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  sonarr:
    image: ${SONARR_IMAGE:-lscr.io/linuxserver/sonarr:4.0.20.3014-ls4}
    container_name: sonarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - media
    ports:
      - "${LAN_BIND_IP:-127.0.0.1}:${SONARR_PORT:-8989}:8989/tcp"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      UMASK: ${UMASK:-002}
    volumes:
      # Persistent Sonarr state.
      - ${CONFIG_ROOT:-./config}/sonarr:/config
      # Mounting /media as one tree preserves atomic moves and hardlinks.
      - ${MEDIA_ROOT:-/mnt/data/media}:/media
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8989/ping >/dev/null || wget -q --spider http://127.0.0.1:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  radarr:
    image: ${RADARR_IMAGE:-lscr.io/linuxserver/radarr:6.4.4.10685-ls326}
    container_name: radarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - media
    ports:
      - "${LAN_BIND_IP:-127.0.0.1}:${RADARR_PORT:-7878}:7878/tcp"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      UMASK: ${UMASK:-002}
    volumes:
      # Persistent Radarr state.
      - ${CONFIG_ROOT:-./config}/radarr:/config
      # Mounting /media as one tree preserves atomic moves and hardlinks.
      - ${MEDIA_ROOT:-/mnt/data/media}:/media
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7878/ping >/dev/null || wget -q --spider http://127.0.0.1:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  jackett:
    image: ${JACKETT_IMAGE:-lscr.io/linuxserver/jackett:v0.24.3055-ls35}
    container_name: jackett
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - media
    ports:
      # Jackett WebUI is intended for LAN access only.
      - "${LAN_BIND_IP:-127.0.0.1}:${JACKETT_PORT:-9117}:9117/tcp"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      UMASK: ${UMASK:-002}
      # Updates are managed by changing JACKETT_IMAGE and recreating the container.
      AUTO_UPDATE: "false"
    volumes:
      # Persistent Jackett state and indexer configuration.
      - ${CONFIG_ROOT:-./config}/jackett:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9117/ >/dev/null || wget -q --spider http://127.0.0.1:9117/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  watchtower:
    image: ${WATCHTOWER_IMAGE:-nickfedor/watchtower:1.24.0}
    container_name: watchtower
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    networks:
      - media
    environment:
      TZ: ${TZ:-Etc/UTC}
      WATCHTOWER_CLEANUP: ${WATCHTOWER_CLEANUP:-true}
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCHEDULE: ${WATCHTOWER_SCHEDULE:-0 0 4 * * *}
    volumes:
      # Required by Watchtower to inspect and recreate labeled containers.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "/watchtower", "--health-check"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      com.centurylinklabs.watchtower.enable: "false"

networks:
  media:
    name: media-server
    driver: bridge
