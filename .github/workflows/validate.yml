name: Validate project
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts and Compose
        run: |
          bash -n scripts/start-media-server.sh scripts/package-release.sh
          python3 -c "import ast, pathlib; ast.parse(pathlib.Path('updater/update_server.py').read_text())"
          docker compose --env-file .env.example -f docker-compose.yml config --quiet
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
          git diff --check
      - name: Build source release archives
        run: bash scripts/package-release.sh
