# Docker's embedded DNS refreshes the updater address after container recreation.
# Keep the static dashboard available even when the updater is temporarily absent.
upstream media_updater {
  zone media_updater 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;
  server updater:8080 resolve;
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  location = /api/update {
    proxy_pass http://media_updater/update;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Update-Token $http_x_update_token;
    proxy_read_timeout 15s;
  }

  location = /api/update/status {
    proxy_pass http://media_updater/update/status;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Update-Token $http_x_update_token;
    proxy_read_timeout 15s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
